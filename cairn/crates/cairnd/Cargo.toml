[package]
name = "cairnd"
description = "Cairn server: lightweight OpenTofu automation (TFE-compatible API, runner, state)"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["download"]
# mimalloc: ~30% more API throughput under heavy concurrency, but ~10 MiB more
# resident memory at idle (1.5 vs 11 MiB). Off by default: small hosts first.
mimalloc = ["dep:mimalloc"]
# Download OpenTofu releases (checksum-verified) when a stack asks for a version
# that is not cached. Without it, engines must be pre-seeded or on PATH.
download = []

[dependencies]
anyhow = "1"
axum-server = { version = "0.8", features = ["tls-rustls-no-provider"] }
base64 = "0.22"
jsonwebtoken = { version = "10", default-features = false, features = ["rust_crypto"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
bytes = "1"
chacha20poly1305 = "0.10"
clap = { version = "4", features = ["derive", "env"] }
flate2 = "1"
hex = "0.4"
sha1 = "0.10"
regorus = { version = "0.14", default-features = false, features = ["arc", "regex", "glob", "semver", "std", "time"] }
hmac = "0.12"
mimalloc = { version = "0.1", default-features = false, optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.10"
tar = "0.4"
time = { version = "0.3", features = ["parsing"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "process", "sync", "time", "signal", "fs", "io-util"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "std"] }
ureq = { version = "2", features = ["json", "native-certs"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
