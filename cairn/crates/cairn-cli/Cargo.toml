[package]
name = "cairn-cli"
description = "cairn: CLI and MCP server for the Cairn OpenTofu automation server"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "cairn"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tar = "0.4"
ureq = { version = "2", features = ["json"] }
